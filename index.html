*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--pg);color:var(--tx);font-family:'Pixelify Sans',ui-monospace,monospace}
h1{text-align:center;margin:10px 0 0;font-size:26px;letter-spacing:1px}
#app{max-width:980px;margin:0 auto;padding:12px;display:grid;gap:14px;grid-template-columns:minmax(0,380px) 1fr}

.stage{position:relative;border:4px solid var(--bd);border-radius:14px;overflow:hidden;height:clamp(330px,52vh,440px);transition:background .4s}
.ground{position:absolute;left:0;right:0;bottom:0;height:46px;border-top:4px solid #0002}
.sh{position:absolute;left:50%;bottom:42px;width:110px;height:16px;border-radius:50%;background:#0002;transform:translateX(-50%)}
.cv{position:absolute;left:50%;bottom:48px;height:74%;aspect-ratio:7/9;transform:translateX(-50%);image-rendering:pixelated;cursor:pointer}
.dec span{position:absolute;opacity:.75;animation:fl 5s ease-in-out infinite;font-family:sans-serif;font-variant-emoji:text}
@keyframes fl{50%{transform:translateY(-14px) rotate(12deg)}}
.bub{position:absolute;right:14%;top:10%;background:#fff;color:#3b2a3a;border:3px solid #3b2a3a;border-radius:10px;padding:4px 10px;font-weight:700;transform:scale(0);transition:transform .12s}
.bub.on{transform:scale(1) rotate(-6deg)}
.bgn{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.rot{position:absolute;bottom:6px;width:46px;height:34px;border-radius:12px;border:3px solid var(--bd);background:var(--wd);color:var(--tx);cursor:pointer;padding:0;display:grid;place-items:center;z-index:3}
.rot.rl{left:calc(50% - 54px)}.rot.rr{left:calc(50% + 8px)}
.rot:active{transform:scale(.93)}
.rot svg{width:18px;height:18px}
.bgn button{font:inherit;width:34px;height:34px;border-radius:8px;border:3px solid var(--bd);background:var(--wd);color:var(--tx);cursor:pointer;font-weight:700}
.panel{border:4px solid var(--bd);border-radius:14px;background:var(--pn);padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;border:3px solid var(--bd);background:var(--wd);color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer}
.tab.on{background:var(--wd2);box-shadow:inset 0 -4px #0002;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;max-height:270px;overflow:auto;padding:2px}
.opt{border:3px solid var(--bd);background:#fff8;border-radius:10px;padding:4px;cursor:pointer;font:inherit;font-size:12px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:2px}
.opt canvas{width:64px;height:64px;image-rendering:pixelated}
.opt.on{background:#ffd3e6;outline:3px solid #ff7aa8;color:#4a3326}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:8px;border:3px solid var(--bd);cursor:pointer;padding:0}
.sw.on{outline:3px solid #ff7aa8;outline-offset:1px}
.note{font-size:12px;opacity:.8;margin:0}
.acts{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:6px}
.dice{width:58px;height:58px;border:4px solid var(--bd);background:#cfe9ff;border-radius:14px;color:#7a6af5;cursor:pointer;padding:6px}
.dice.spin svg{animation:sp .5s}
@keyframes sp{to{transform:rotate(360deg) scale(1.2)}}
.btn{font:inherit;font-weight:700;font-size:16px;border:4px solid var(--bd);border-radius:12px;padding:12px 18px;cursor:pointer;color:#3b2a3a}
.reset{background:#ffb3bf}.next{background:#9be3b0;margin-left:auto}
.btn:active,.dice:active{transform:translateY(2px)}
.md{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:9;padding:16px}
.md[hidden]{display:none}
.card{background:var(--pn);border:4px solid var(--bd);border-radius:16px;padding:16px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.card canvas{height:150px;aspect-ratio:7/9;image-rendering:pixelated}
.card input{font:inherit;width:100%;padding:8px;border:3px solid var(--bd);border-radius:8px;text-align:center;background:#fff;color:#3b2a3a}
.card p{margin:0;font-size:13px}

.card{max-height:94vh;overflow:auto}
#gm{position:fixed;inset:0;z-index:20;background:#1d1a24;font-family:'Pixelify Sans',sans-serif;touch-action:none}
#gm[hidden],#emp[hidden]{display:none}
#gc{width:100%;height:100%;display:block;touch-action:none}

#gt{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:6px}
.gb{width:36px;height:36px;border-radius:10px;border:3px solid var(--bd);background:var(--wd);color:var(--tx);font-size:16px;cursor:pointer;padding:0}

EM.forEach(e=>{const b=document.createElement('button');b.className='gb';b.textContent=e;b.onclick=()=>{emote(me,e);if(channelReady)broadcast('emote',{name:pn,emoji:e,client:CLIENT_ID,id:++eq});$('#emp').hidden=true};$('#emp').append(b)});
$('#em').onclick=()=>$('#emp').hidden=!$('#emp').hidden;
tabs.forEach((b,i)=>b.onclick=()=>setMap(i));$('#gx').onclick=()=>{G.hidden=true;keys={};stopMic();leave()};
$('#next').onclick=()=>{const k=$('#card'),bg=['#9be3b0','#ffd9a0','#ffb38a'],ic=['🏫','🍜','🚩'];
 k.innerHTML=`<b style="font-size:20px">Pilih Map</b><canvas id="mc" width="280" height="360"></canvas><input id="nm" maxlength="14" placeholder="Nama karakter..."><p>Mau main di mana? Pemain asli di map yang sama akan muncul.</p>`+MP.map((m,i)=>`<button class="btn next" data-i="${i}" style="margin:0;width:100%;background:${bg[i]}">${ic[i]} ${m.n}</button>`).join('')+`<button class="tab" id="bk">Kembali</button>`;
 $('#md').hidden=false;$('#bk').onclick=()=>$('#md').hidden=true;
 k.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{snap={...cfg};pn=$('#nm').value.trim()||'Pemain';$('#md').hidden=true;G.hidden=false;HS.innerHTML='';setMap(+b.dataset.i);me.f=VW;log('','Tip: tahan Shift (atau tarik joystick jauh) untuk berlari.',1)})};

const rem=new Map(),actors=()=>[me,...rem.values(),...(rem.size?[]:bots)];
// ===== Voice chat jarak dekat (WebRTC; signaling lewat Supabase Realtime) =====
const VR=240,pcs=new Map(),ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};let micOn=false,micStream=null,hb=0;
const rtcSend=(to,d)=>broadcast('rtc',{from:CLIENT_ID,to,...d});
const micTrack=()=>micStream?micStream.getAudioTracks()[0]:null;
function rtcEnsure(peer){if(!window.RTCPeerConnection)return null;let e=pcs.get(peer);if(e)return e;
 const pc=new RTCPeerConnection(ICE),au=new Audio();au.autoplay=true;au.volume=0;e={pc,au,q:[],rd:false};pcs.set(peer,e);
 pc.onicecandidate=ev=>{if(ev.candidate)rtcSend(peer,{c:ev.candidate})};
 pc.ontrack=ev=>{au.srcObject=ev.streams[0]||new MediaStream([ev.track]);au.play().catch(()=>{})};
 pc.onconnectionstatechange=()=>{if(pc.connectionState=='failed')rtcClose(peer)};
 if(CLIENT_ID<peer){pc.addTransceiver('audio',{direction:'sendrecv'});if(micTrack())pc.getSenders()[0].replaceTrack(micTrack());
  pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>rtcSend(peer,{s:pc.localDescription})).catch(()=>{})}
 return e}
function rtcClose(peer){const e=pcs.get(peer);if(!e)return;try{e.pc.close()}catch(x){}e.au.srcObject=null;pcs.delete(peer)}
async function rtcHandle(m){if(!m||m.to!==CLIENT_ID||!m.from)return;const e=rtcEnsure(m.from);if(!e)return;const pc=e.pc;
 try{if(m.s){if(m.s.type=='offer'&&CLIENT_ID<m.from)return;await pc.setRemoteDescription(m.s);e.rd=true;
   if(m.s.type=='offer'){pc.getTransceivers().forEach(t=>t.direction='sendrecv');if(micTrack())await pc.getSenders()[0].replaceTrack(micTrack());
    const a=await pc.createAnswer();await pc.setLocalDescription(a);rtcSend(m.from,{s:pc.localDescription})}
   while(e.q.length)await pc.addIceCandidate(e.q.shift())}
  else if(m.c){if(e.rd)await pc.addIceCandidate(m.c);else e.q.push(m.c)}}catch(x){}}
// makin jauh makin pelan, makin dekat makin keras; di luar radius = tidak terdengar
function volUpd(){pcs.forEach((e,pe)=>{const o=rem.get(pe),d=o?Math.hypot(o.x-me.x,o.y-me.y):1e9;e.au.volume=d<VR?Math.pow(1-d/VR,2):0})}
function stopMic(){micOn=false;if(micStream)micStream.getTracks().forEach(t=>t.stop());micStream=null;pcs.forEach(e=>e.pc.getSenders().forEach(s=>s.replaceTrack(null).catch(()=>{})));$('#mic').classList.remove('on');broadcastState()}
$('#mic').onclick=async()=>{if(micOn){stopMic();return}
 try{micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});micOn=true;
  pcs.forEach(e=>e.pc.getSenders().forEach(s=>s.replaceTrack(micTrack()).catch(()=>{})));$('#mic').classList.add('on');broadcastState();
  log('','Mic aktif. Suaramu hanya terdengar oleh pemain di dekatmu.',1)}
 catch(err){log('','Mikrofon tidak bisa diakses. Izinkan akses mikrofon (butuh HTTPS atau localhost).',1)}};
let supabaseClient=null,channel=null,channelReady=false,sq=0,eq=0,pt=0,lq='',lastChatAt=0;
const CLIENT_ID=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'p-'+Math.random().toString(36).slice(2)+Date.now();
const cl=(v,n)=>Math.max(0,Math.min(n-1,Number(v)||0));
const cleanCfg=c=>({g:c&&c.g==='f'?'f':'m',skin:cl(c&&c.skin,6),hair:cl(c&&c.hair,HR.length),hc:cl(c&&c.hc,HAIRC.length),top:cl(c&&c.top,13),tc:cl(c&&c.tc,CLR.length),bot:cl(c&&c.bot,12),bc:cl(c&&c.bc,BOTC.length),shoe:cl(c&&c.shoe,10),sc:cl(c&&c.sc,8),acc:cl(c&&c.acc,13),ac:cl(c&&c.ac,CLR.length)});
function playerPayload(){return {id:CLIENT_ID,n:String(pn||'Pemain').slice(0,14),c:cleanCfg(snap||cfg),x:Math.round(me.x),y:Math.round(me.y),vx:Math.round(me.vx||0),vy:Math.round(me.vy||0),f:me.f|0,mic:micOn?1:0,s:(me.say&&now<me.st)?me.say:'',sid:me.sid||''}}
function broadcast(event,payload){
  // Jangan kirim sebelum Realtime channel benar-benar tersambung.
  // Jika belum SUBSCRIBED, supabase-js dapat mencoba fallback REST.
  if(!channel || !channelReady) return;
  channel.send({type:'broadcast',event,payload}).then(status=>{
    if(status && status!=='ok') log('','Pengiriman Realtime gagal: '+status,1);
  }).catch(err=>log('','Gagal mengirim Realtime: '+(err?.message||err),1));
}
function broadcastState(){if(channel)broadcast('state',playerPayload())}
function updateRemote(peer,v){if(!v||v.id===CLIENT_ID||!v.c)return;let o=rem.get(peer);
 if(!o){o=mk(String(v.n||'Pemain').slice(0,14),cleanCfg(v.c),0);o.x=Number(v.x)||480;o.y=Number(v.y)||300;o.tx=o.x;o.ty=o.y;o.rvx=0;o.rvy=0;o.ms=0;o.es=0;rem.set(peer,o);log('',o.name+' ada di sini',1)}
 o.name=String(v.n||'Pemain').slice(0,14);o.tx=Math.max(14,Math.min(WW-14,Number(v.x)||0));o.ty=Math.max(14,Math.min(WH-4,Number(v.y)||0));o.rvx=Number(v.vx)||0;o.rvy=Number(v.vy)||0;
 if(v.c)o.cfg=cleanCfg(v.c);if(v.f!=null)o.f=cl(v.f,4);o.mic=v.mic?1:0;
 if(v.s&&v.sid&&v.sid!==o.sid){o.sid=v.sid;say(o,String(v.s).slice(0,60))}rtcEnsure(peer)}
function syncPresence(){if(!channel)return;const state=channel.presenceState(),ids=new Set();
 Object.entries(state).forEach(([peer,list])=>{if(peer===CLIENT_ID)return;(list||[]).forEach(v=>{if(v&&v.id!==CLIENT_ID){ids.add(peer);updateRemote(peer,v)}})});
 [...rem].forEach(([peer,o])=>{if(!ids.has(peer)){log('',o.name+' keluar',1);rtcClose(peer);rem.delete(peer)}})}
function leave(){const old=channel;channel=null;channelReady=false;pcs.forEach((e,p)=>rtcClose(p));rem.clear();lq='';if(old){try{old.untrack();supabaseClient&&supabaseClient.removeChannel(old)}catch(e){}}}
async function joinRoom(i){leave();
 if(!supabaseClient){log('','Supabase belum dikonfigurasi. Isi URL dan key di bagian atas file HTML.',1);return}
 const room='map-'+i;
 try{const ch=supabaseClient.channel(room,{config:{broadcast:{self:false,ack:false},presence:{key:CLIENT_ID}}});channel=ch;
  ch.on('presence',{event:'sync'},()=>syncPresence());
  ch.on('presence',{event:'join'},()=>syncPresence());
  ch.on('presence',{event:'leave'},()=>syncPresence());
  ch.on('broadcast',{event:'state'},({payload})=>{if(payload&&payload.id!==CLIENT_ID)updateRemote(payload.id,payload)});
  ch.on('broadcast',{event:'rtc'},({payload})=>rtcHandle(payload));
  ch.on('broadcast',{event:'chat'},({payload})=>{if(!payload||payload.clientId===CLIENT_ID)return;
   const text=String(payload.text||'').slice(0,60);if(!text)return;
   let o=rem.get(payload.clientId);
   if(!o&&payload.p){updateRemote(payload.clientId,payload.p);o=rem.get(payload.clientId)}
   if(!o)o=[...rem.values()].find(x=>x.name===payload.name);
   if(o){if(payload.id&&o.sid===payload.id)return;o.sid=payload.id||o.sid;say(o,text)}else log(String(payload.name||'Pemain').slice(0,14),text)});
  ch.on('broadcast',{event:'emote'},({payload})=>{if(!payload||payload.client===CLIENT_ID)return;let o=rem.get(payload.client)||[...rem.values()].find(x=>x.name===payload.name);if(o)emote(o,String(payload.emoji||'').slice(0,4));else{const temp={name:String(payload.name||'Pemain')};log(temp.name,String(payload.emoji||'').slice(0,4))}});
  ch.subscribe(async status=>{
   if(channel!==ch) return;
   if(status==='SUBSCRIBED'&&!G.hidden&&mi===i){
    channelReady=true;
    try{const presenceStatus=await ch.track(playerPayload());if(presenceStatus && presenceStatus!=='ok')log('','Channel tersambung, tetapi presence gagal: '+presenceStatus,1);}
    catch(err){log('','Gagal mendaftarkan pemain: '+(err?.message||err),1)}
    broadcastState();
    log('','Terhubung ke Supabase Realtime. Map: '+room,1);
   } else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
    channelReady=false;
    log('','Koneksi Realtime gagal ('+status+'). Periksa Project URL, publishable/anon key, dan pengaturan Realtime.',1);
   }
  });
 }catch(e){channel=null;log('','Gagal menghubungkan multiplayer. Periksa konfigurasi Supabase.',1)}}
if(window.supabase&&SUPABASE_URL.startsWith('https://')&&!SUPABASE_KEY.includes('PASTE_')){try{supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{realtime:{params:{eventsPerSecond:40}}})}catch(e){supabaseClient=null}}
(function lp(t){requestAnimationFrame(lp);if(G.hidden){last=0;return}now=t;const dt=Math.min(.05,(t-(last||t))/1e3);last=t;update(dt);render(t)})(0);
})();
